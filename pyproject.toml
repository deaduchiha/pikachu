[project]
name = "pikachu"
version = "0.2.0"
description = "Trieste Mensa Telegram bot (VPS + aiogram + WPPConnect)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.28.2",
    "aiohttp>=3.11.0",
    "beautifulsoup4",
    "httpx",
    "pillow",
    "pypdf",
    "pytesseract",
    "python-dotenv",
]

[project.scripts]
pikachu = "src.main:main"

[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

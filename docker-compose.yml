services:
  wppconnect:
    image: ibsddev/wppconnect-server:latest
    restart: unless-stopped
    environment:
      PORT: "21465"
      WPP_SECRET_KEY: ${WPPCONNECT_SECRET_KEY:-}
      WPP_START_ALL_SESSION: "true"
      WPP_TOKEN_STORE_TYPE: file
    volumes:
      - wppconnect_tokens:/usr/src/wpp-server/tokens
      - wppconnect_userdata:/usr/src/wpp-server/userDataDir
    networks:
      - internal
    # Expose only on localhost for initial QR scan; remove in production if using SSH tunnel
    ports:
      - "21465:21465"

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      - wppconnect
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      WEBHOOK_HOST: ${WEBHOOK_HOST}
      WEBHOOK_PATH: ${WEBHOOK_PATH:-/webhook}
      WEBHOOK_PORT: "8080"
      WPPCONNECT_URL: http://wppconnect:21465
      WPPCONNECT_SESSION: ${WPPCONNECT_SESSION:-default}
      WPPCONNECT_SECRET_KEY: ${WPPCONNECT_SECRET_KEY:-}
      WHATSAPP_CHANNEL_ID: ${WHATSAPP_CHANNEL_ID:-}
      WHATSAPP_CHANNEL_INVITE: ${WHATSAPP_CHANNEL_INVITE:-0029Vb5cElw5a23zVecmn70P}
      ARDIS_MENU_URL: ${ARDIS_MENU_URL:-https://www.ardis.fvg.it/contenuti.php?id=214&view=page}
      ARDIS_FALLBACK: ${ARDIS_FALLBACK:-false}
      TRANSLATE_URL: ${TRANSLATE_URL:-}
      TRANSLATE_API_KEY: ${TRANSLATE_API_KEY:-}
      CACHE_DIR: /data/cache
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-1800}
      REFRESH_INTERVAL_SECONDS: ${REFRESH_INTERVAL_SECONDS:-900}
    volumes:
      - menu_cache:/data/cache
    networks:
      - internal
      - edge
    ports:
      - "8080:8080"

volumes:
  wppconnect_tokens:
  wppconnect_userdata:
  menu_cache:

networks:
  internal:
  edge:

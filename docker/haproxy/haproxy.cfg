global
    log stdout format raw daemon
    maxconn 256

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_in
    bind *:80
    bind *:443 ssl crt /etc/ssl/certs/combined.pem
    default_backend bot

backend bot
    option httpchk GET /health
    http-check expect status 200
    server bot1 bot:8080 check inter 10s fall 3 rise 2
